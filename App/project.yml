name: Dizi
options:
  bundleIdPrefix: io.upivot
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  ScoreKit:
    path: ../Packages/ScoreKit
targets:
  Dizi:
    type: application
    platform: iOS
    sources:
      - path: Dizi
        excludes: ["Samples/**"]
      - path: Dizi/Samples
        type: folder
        buildPhase: resources
      - path: ../docs/examples/molihua.ir.json
        buildPhase: resources
    dependencies:
      - package: ScoreKit
    scheme:
      testTargets: [DiziUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.upivot.dizi
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 鱼米竹笛
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  DiziUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DiziUITests]
    dependencies:
      - target: Dizi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.upivot.dizi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dizi
